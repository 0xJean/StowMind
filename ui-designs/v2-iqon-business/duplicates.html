<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Satoshi', 'sans-serif'] },
                    colors: {
                        appBg: '#08080a', cardBg: '#111215', cardBorder: '#1c1d22',
                        textMain: '#ffffff', textMuted: '#82838a',
                        accentGreen: '#00e599', accentCyan: '#00d2ff', accentPurple: '#b14bff'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: transparent; color: #ffffff; }
        .bento-card {
            background-color: #111215; border: 1px solid #1c1d22; border-radius: 20px;
        }
        .scan-pulse {
            animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body class="p-8 font-sans h-full flex flex-col overflow-hidden">

    <div class="flex justify-between items-end mb-6 flex-shrink-0">
        <div>
            <p class="text-[#82838a] text-[10px] font-bold tracking-widest uppercase mb-0.5">Optimize</p>
            <h1 class="text-2xl font-bold tracking-tight">Find Duplicates</h1>
        </div>
    </div>

    <div class="flex-1 bento-card flex flex-col items-center justify-center text-center p-12 relative overflow-hidden">

        <!-- Background abstract mesh -->
        <div class="absolute inset-0 opacity-20" style="background: radial-gradient(circle at center, rgba(0, 210, 255, 0.2) 0%, transparent 60%);"></div>

        <!-- Decorative rings -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[250px] h-[250px] border border-[#1c1d22] rounded-full"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] border border-[#1c1d22] rounded-full"></div>

        <div class="relative mb-8">
            <div class="absolute inset-0 bg-[#00d2ff] rounded-full scan-pulse"></div>
            <div class="w-20 h-20 bg-[#111215] border border-[#1c1d22] rounded-full flex items-center justify-center relative z-10 shadow-[0_0_20px_rgba(0,210,255,0.2)]">
                <i data-lucide="copy" class="w-8 h-8 text-[#00d2ff]"></i>
            </div>
        </div>

        <h2 class="text-2xl font-bold mb-3 relative z-10">Scan for duplicates</h2>
        <p class="text-[#82838a] max-w-sm mb-8 relative z-10 text-[11px] leading-relaxed">Select a directory to scan. We'll analyze file contents with SHA-256 checksums to find true duplicates safely, even if they have different names.</p>

        <div class="flex gap-3 relative z-10">
            <button class="px-5 py-2.5 bg-[#16171a] border border-[#1c1d22] hover:bg-[#1c1d22] rounded-xl text-xs font-bold transition-colors flex items-center gap-2">
                <i data-lucide="folder" class="w-4 h-4"></i> Choose Folder
            </button>
            <button class="px-6 py-2.5 bg-[#00d2ff] text-black hover:bg-[#00bfff] rounded-xl text-xs font-bold transition-colors shadow-[0_0_15px_rgba(0,210,255,0.3)]">
                Start Scan
            </button>
        </div>

        <div class="mt-10 text-[9px] text-[#82838a] relative z-10 flex items-center gap-1.5 bg-[#111215] px-3 py-1.5 rounded-lg border border-[#1c1d22]">
            <div class="w-1.5 h-1.5 rounded-full bg-[#00e599] shadow-[0_0_5px_#00e599]"></div>
            System files are automatically excluded from the scan.
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
