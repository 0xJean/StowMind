<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Satoshi', 'sans-serif'] },
                    colors: {
                        appBg: '#08080a', cardBg: '#111215', cardBorder: '#1c1d22',
                        textMain: '#ffffff', textMuted: '#82838a',
                        accentGreen: '#00e599', accentCyan: '#00d2ff', accentPurple: '#b14bff'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: transparent; color: #ffffff; }
        .bento-card {
            background-color: #111215; border: 1px solid #1c1d22; border-radius: 20px; transition: all 0.3s ease;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1c1d22; border-radius: 10px; }

        /* Custom Donut Chart CSS */
        .donut-segment {
            transition: stroke-width 0.2s, filter 0.2s;
            cursor: pointer;
        }
        .donut-segment:hover {
            stroke-width: 45;
            filter: drop-shadow(0 0 10px currentColor);
        }
    </style>
</head>
<body class="p-8 font-sans h-full flex flex-col overflow-hidden">

    <div class="flex justify-between items-center mb-6 flex-shrink-0">
        <div>
            <p class="text-[#82838a] text-[10px] font-bold tracking-widest uppercase mb-0.5">Optimize</p>
            <h1 class="text-2xl font-bold tracking-tight">Space Analysis</h1>
        </div>
        <button class="px-4 py-2 bg-[#111215] border border-[#1c1d22] hover:bg-[#16171a] rounded-xl text-xs font-bold transition-colors flex items-center gap-2">
            <i data-lucide="refresh-cw" class="w-3 h-3"></i> Rescan Drive
        </button>
    </div>

    <div class="flex gap-4 flex-1 min-h-0">

        <!-- Left: Visual Chart Area -->
        <div class="flex-1 bento-card p-6 flex flex-col relative overflow-hidden">
            <div class="absolute top-6 left-6 z-10">
                <h3 class="text-sm font-bold text-white">Macintosh HD</h3>
                <p class="text-[10px] text-[#82838a] mt-0.5">512 GB Total Capacity</p>
            </div>

            <div class="flex-1 flex items-center justify-center relative">
                <!-- SVG Donut Chart replacing the line chart -->
                <div class="w-[320px] h-[320px] relative">
                    <svg viewBox="0 0 100 100" class="w-full h-full transform -rotate-90">
                        <!-- Apps (Cyan) -->
                        <circle cx="50" cy="50" r="30" fill="none" stroke="#00d2ff" stroke-width="35" stroke-dasharray="80 188.5" class="donut-segment text-[#00d2ff]" />
                        <!-- Documents (Purple) -->
                        <circle cx="50" cy="50" r="30" fill="none" stroke="#b14bff" stroke-width="35" stroke-dasharray="40 188.5" stroke-dashoffset="-82" class="donut-segment text-[#b14bff]" />
                        <!-- Media (Green) -->
                        <circle cx="50" cy="50" r="30" fill="none" stroke="#00e599" stroke-width="35" stroke-dasharray="30 188.5" stroke-dashoffset="-124" class="donut-segment text-[#00e599]" />
                        <!-- System (Gray) -->
                        <circle cx="50" cy="50" r="30" fill="none" stroke="#27282d" stroke-width="35" stroke-dasharray="20 188.5" stroke-dashoffset="-156" class="donut-segment text-[#27282d]" />

                        <!-- Inner Cutout -->
                        <circle cx="50" cy="50" r="15" fill="#111215" />
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                        <span class="text-2xl font-bold text-white">52%</span>
                        <span class="text-[9px] text-[#82838a] uppercase tracking-wider">Used</span>
                    </div>
                </div>
            </div>

            <!-- Legend -->
            <div class="flex justify-center gap-6 mt-4">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-[#00d2ff] shadow-[0_0_5px_#00d2ff]"></div>
                    <span class="text-[10px] font-bold text-white">Apps <span class="text-[#82838a] font-normal">120GB</span></span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-[#b14bff] shadow-[0_0_5px_#b14bff]"></div>
                    <span class="text-[10px] font-bold text-white">Docs <span class="text-[#82838a] font-normal">60GB</span></span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-[#00e599] shadow-[0_0_5px_#00e599]"></div>
                    <span class="text-[10px] font-bold text-white">Media <span class="text-[#82838a] font-normal">45GB</span></span>
                </div>
            </div>
        </div>

        <!-- Right: Directory Breakdown -->
        <div class="w-80 flex flex-col gap-3 flex-shrink-0">
            <div class="bento-card p-4 flex-1 flex flex-col">
                <h3 class="text-xs font-bold text-white mb-4 uppercase tracking-widest text-[#82838a]">Largest Folders</h3>

                <div class="flex-1 overflow-y-auto space-y-2 pr-2">
                    <!-- Folder Item -->
                    <div class="p-3 bg-[#16171a] border border-[#1c1d22] rounded-xl hover:border-[#27282d] transition-colors cursor-pointer group">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <i data-lucide="folder" class="w-4 h-4 text-[#00d2ff]"></i>
                                <span class="text-xs font-bold text-white">Applications</span>
                            </div>
                            <span class="text-xs font-mono font-bold text-white">120 GB</span>
                        </div>
                        <div class="h-1 w-full bg-[#111215] rounded-full overflow-hidden">
                            <div class="h-full bg-[#00d2ff] rounded-full shadow-[0_0_5px_#00d2ff]" style="width: 45%"></div>
                        </div>
                    </div>

                    <!-- Folder Item -->
                    <div class="p-3 bg-[#16171a] border border-[#1c1d22] rounded-xl hover:border-[#27282d] transition-colors cursor-pointer group">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <i data-lucide="folder" class="w-4 h-4 text-[#b14bff]"></i>
                                <span class="text-xs font-bold text-white">Library</span>
                            </div>
                            <span class="text-xs font-mono font-bold text-white">85 GB</span>
                        </div>
                        <div class="h-1 w-full bg-[#111215] rounded-full overflow-hidden">
                            <div class="h-full bg-[#b14bff] rounded-full shadow-[0_0_5px_#b14bff]" style="width: 32%"></div>
                        </div>
                    </div>

                    <!-- Folder Item -->
                    <div class="p-3 bg-[#16171a] border border-[#1c1d22] rounded-xl hover:border-[#27282d] transition-colors cursor-pointer group">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <i data-lucide="folder" class="w-4 h-4 text-[#00e599]"></i>
                                <span class="text-xs font-bold text-white">Downloads</span>
                            </div>
                            <span class="text-xs font-mono font-bold text-white">45 GB</span>
                        </div>
                        <div class="h-1 w-full bg-[#111215] rounded-full overflow-hidden">
                            <div class="h-full bg-[#00e599] rounded-full shadow-[0_0_5px_#00e599]" style="width: 18%"></div>
                        </div>
                    </div>

                    <!-- Folder Item -->
                    <div class="p-3 bg-[#16171a] border border-[#1c1d22] rounded-xl hover:border-[#27282d] transition-colors cursor-pointer group">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <i data-lucide="folder" class="w-4 h-4 text-[#82838a]"></i>
                                <span class="text-xs font-bold text-white">Documents</span>
                            </div>
                            <span class="text-xs font-mono font-bold text-white">15 GB</span>
                        </div>
                        <div class="h-1 w-full bg-[#111215] rounded-full overflow-hidden">
                            <div class="h-full bg-[#82838a] rounded-full" style="width: 5%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
