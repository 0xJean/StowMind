<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Satoshi', 'sans-serif'] },
                    colors: {
                        appBg: '#08080a', cardBg: '#111215', cardBorder: '#1c1d22',
                        textMain: '#ffffff', textMuted: '#82838a',
                        accentGreen: '#00e599', accentCyan: '#00d2ff', accentPurple: '#b14bff'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: transparent; color: #ffffff; }
        .bento-card {
            background-color: #111215; border: 1px solid #1c1d22; border-radius: 20px; transition: all 0.3s ease;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1c1d22; border-radius: 10px; }

        th { text-transform: uppercase; font-size: 0.55rem; letter-spacing: 0.1em; color: #82838a; font-weight: 700; }
        tr { border-bottom: 1px solid #1c1d22; }
        tr:last-child { border-bottom: none; }

        .custom-checkbox {
            appearance: none; width: 14px; height: 14px;
            border: 2px solid #27282d; border-radius: 4px;
            background-color: #111215; cursor: pointer; position: relative; transition: all 0.2s;
        }
        .custom-checkbox:checked {
            background-color: #00e599; border-color: #00e599; box-shadow: 0 0 8px rgba(0, 229, 153, 0.4);
        }
        .custom-checkbox:checked::after {
            content: ''; position: absolute; left: 3px; top: 1px;
            width: 3px; height: 7px; border: solid #08080a; border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
    </style>
</head>
<body class="p-8 font-sans h-full flex flex-col overflow-hidden">

    <div class="flex justify-between items-center mb-6 flex-shrink-0">
        <div>
            <p class="text-[#82838a] text-[10px] font-bold tracking-widest uppercase mb-0.5">Optimize</p>
            <h1 class="text-2xl font-bold tracking-tight">App Uninstaller</h1>
        </div>

        <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-3 h-3 text-[#82838a]"></i>
            <input type="text" placeholder="Search apps..." class="w-64 bg-[#111215] border border-[#1c1d22] rounded-xl pl-8 pr-4 py-2 text-xs focus:outline-none focus:border-[#27282d] transition-colors text-white placeholder-[#82838a]">
        </div>
    </div>

    <div class="bento-card flex-1 flex flex-col overflow-hidden">
        <div class="overflow-y-auto flex-1">
            <table class="w-full text-left border-collapse">
                <thead class="sticky top-0 bg-[#111215] z-10 border-b border-[#1c1d22]">
                    <tr>
                        <th class="py-3 px-4 w-10"><input type="checkbox" class="custom-checkbox"></th>
                        <th class="py-3 px-2">Application</th>
                        <th class="py-3 px-6 text-right">Size</th>
                        <th class="py-3 px-6 text-right">Last Used</th>
                        <th class="py-3 px-6 text-right">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="hover:bg-[#16171a] transition-colors group">
                        <td class="py-3 px-4"><input type="checkbox" class="custom-checkbox"></td>
                        <td class="py-3 px-2 flex items-center gap-3">
                            <div class="w-8 h-8 bg-[#08080a] rounded-lg flex items-center justify-center border border-[#1c1d22]">
                                <i data-lucide="figma" class="w-4 h-4 text-white"></i>
                            </div>
                            <div>
                                <div class="font-bold text-xs">Figma</div>
                                <div class="text-[9px] text-[#82838a] mt-0.5">Version 116.15.4</div>
                            </div>
                        </td>
                        <td class="py-3 px-6 text-right font-mono text-[10px] font-bold">845 MB</td>
                        <td class="py-3 px-6 text-right text-[10px] text-[#82838a] font-medium">Today</td>
                        <td class="py-3 px-6 text-right">
                            <button class="opacity-0 group-hover:opacity-100 px-3 py-1.5 bg-[#ef4444]/10 text-[#ef4444] hover:bg-[#ef4444]/20 rounded-lg text-[9px] font-bold transition-all border border-[#ef4444]/20">Uninstall</button>
                        </td>
                    </tr>

                    <tr class="hover:bg-[#16171a] transition-colors group">
                        <td class="py-3 px-4"><input type="checkbox" class="custom-checkbox"></td>
                        <td class="py-3 px-2 flex items-center gap-3">
                            <div class="w-8 h-8 bg-[#08080a] rounded-lg flex items-center justify-center border border-[#1c1d22]">
                                <i data-lucide="slack" class="w-4 h-4 text-white"></i>
                            </div>
                            <div>
                                <div class="font-bold text-xs">Slack</div>
                                <div class="text-[9px] text-[#82838a] mt-0.5">Version 4.36.136</div>
                            </div>
                        </td>
                        <td class="py-3 px-6 text-right font-mono text-[10px] font-bold">512 MB</td>
                        <td class="py-3 px-6 text-right text-[10px] text-[#82838a] font-medium">2 weeks ago</td>
                        <td class="py-3 px-6 text-right">
                            <button class="opacity-0 group-hover:opacity-100 px-3 py-1.5 bg-[#ef4444]/10 text-[#ef4444] hover:bg-[#ef4444]/20 rounded-lg text-[9px] font-bold transition-all border border-[#ef4444]/20">Uninstall</button>
                        </td>
                    </tr>

                    <tr class="hover:bg-[#16171a] transition-colors group">
                        <td class="py-3 px-4"><input type="checkbox" class="custom-checkbox"></td>
                        <td class="py-3 px-2 flex items-center gap-3">
                            <div class="w-8 h-8 bg-[#08080a] rounded-lg flex items-center justify-center border border-[#1c1d22]">
                                <i data-lucide="box" class="w-4 h-4 text-white"></i>
                            </div>
                            <div>
                                <div class="font-bold text-xs">Docker</div>
                                <div class="text-[9px] text-[#82838a] mt-0.5">Version 4.27.1</div>
                            </div>
                        </td>
                        <td class="py-3 px-6 text-right font-mono text-[10px] font-bold">1.4 GB</td>
                        <td class="py-3 px-6 text-right text-[10px] text-[#82838a] font-medium">Yesterday</td>
                        <td class="py-3 px-6 text-right">
                            <button class="opacity-0 group-hover:opacity-100 px-3 py-1.5 bg-[#ef4444]/10 text-[#ef4444] hover:bg-[#ef4444]/20 rounded-lg text-[9px] font-bold transition-all border border-[#ef4444]/20">Uninstall</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
