<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StowMind - Light Clean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        appBg: '#f4f7fe',       /* Main background */
                        sidebarBg: '#ffffff',   /* Sidebar background */
                        cardBg: '#ffffff',      /* Card background */
                        textMain: '#1e293b',    /* Dark text */
                        textMuted: '#8f9bba',   /* Light text */
                        brandBlue: '#4318ff',   /* Primary accent */
                        brandHover: '#3311db',
                        borderLight: '#e2e8f0'
                    },
                    boxShadow: {
                        'soft': '0 10px 30px rgba(112, 144, 176, 0.12)',
                        'blue': '0 10px 20px rgba(67, 24, 255, 0.25)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f4f7fe; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .app-container {
            width: 100%; max-width: 1400px; height: 90vh; min-height: 700px;
            background-color: #f4f7fe; border-radius: 30px; overflow: hidden;
            display: flex; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        /* Sidebar styling */
        aside { width: 260px; background-color: #ffffff; display: flex; flex-direction: column; padding: 32px 24px; border-right: 1px solid #e2e8f0; z-index: 10; }

        .nav-section { margin-bottom: 32px; }
        .nav-title { font-size: 12px; font-weight: 600; color: #8f9bba; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; padding-left: 12px; }

        .nav-item {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 16px;
            color: #8f9bba; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease;
            text-decoration: none; margin-bottom: 4px;
        }
        .nav-item:hover { color: #4318ff; background-color: #f4f7fe; }
        .nav-item.active { background-color: #4318ff; color: #ffffff; box-shadow: 0 4px 12px rgba(67, 24, 255, 0.2); }
        .nav-item.active i { color: #ffffff; }

        /* Main content area */
        main { flex: 1; background-color: #f4f7fe; position: relative; overflow: hidden; }

        /* Custom scrollbar for iframe */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside>
            <!-- Logo -->
            <div class="flex items-center gap-3 px-2 mb-12 cursor-pointer">
                <div class="w-10 h-10 rounded-xl bg-[#4318ff] flex items-center justify-center shadow-blue">
                    <i data-lucide="command" class="w-5 h-5 text-white"></i>
                </div>
                <span class="text-xl font-bold text-[#1e293b] tracking-tight">StowMind</span>
            </div>

            <!-- Navigation Sections -->
            <div class="flex-1 overflow-y-auto pr-2">
                <div class="nav-section">
                    <div class="nav-title">Dashboard</div>
                    <a href="dashboard.html" target="content-frame" class="nav-item active" onclick="setActive(this)">
                        <i data-lucide="layout-grid" class="w-5 h-5"></i> Overview
                    </a>
                    <a href="analyze.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="pie-chart" class="w-5 h-5"></i> Space Analyzer
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-title">Tools</div>
                    <a href="clean.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="sparkles" class="w-5 h-5"></i> Deep Clean
                    </a>
                    <a href="duplicates.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="copy" class="w-5 h-5"></i> Duplicates
                    </a>
                    <a href="apps.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="trash-2" class="w-5 h-5"></i> Uninstaller
                    </a>
                    <a href="organize.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="folder-tree" class="w-5 h-5"></i> Organizer
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-title">System</div>
                    <a href="history.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="clock" class="w-5 h-5"></i> History
                    </a>
                </div>
            </div>

            <!-- Upgrade CTA -->
            <div class="mt-auto pt-6">
                <div class="bg-gradient-to-br from-[#4318ff] to-[#8664ff] rounded-2xl p-5 text-white shadow-blue relative overflow-hidden">
                    <div class="relative z-10">
                        <h4 class="font-semibold text-sm mb-1">StowMind Pro</h4>
                        <p class="text-xs text-white/80 mb-3">Unlock all features</p>
                        <button class="w-full py-2 bg-white text-[#4318ff] rounded-xl text-xs font-bold hover:bg-gray-50 transition-colors">
                            Upgrade Now
                        </button>
                    </div>
                    <!-- Decorative circles -->
                    <div class="absolute -top-6 -right-6 w-20 h-20 bg-white/10 rounded-full blur-xl"></div>
                    <div class="absolute -bottom-8 -left-8 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main>
            <iframe name="content-frame" src="dashboard.html" class="absolute inset-0 w-full h-full border-none"></iframe>
        </main>
    </div>

    <script>
        lucide.createIcons();

        function setActive(element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
