<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StowMind - Soft Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        appBg: '#111111',       /* Sidebar bg */
                        mainBg: '#181818',      /* Main content bg */
                        cardBg: '#222222',      /* Card bg */
                        cardHover: '#2a2a2a',   /* Card hover */
                        borderLight: '#2e2e2e', /* Subtle borders */
                        textMain: '#f3f4f6',
                        textMuted: '#9ca3af',
                        brandPurple: '#a855f7'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .app-container {
            width: 100%; max-width: 1400px; height: 90vh; min-height: 700px;
            background-color: #111111; border-radius: 24px; overflow: hidden;
            display: flex; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #2e2e2e;
        }

        /* Sidebar styling */
        aside { width: 260px; background-color: #111111; display: flex; flex-direction: column; padding: 24px 16px; border-right: 1px solid #2e2e2e; }
        .nav-section { margin-bottom: 24px; }
        .nav-title { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding-left: 12px; display: flex; justify-content: space-between; align-items: center; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px;
            color: #9ca3af; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease;
            text-decoration: none;
        }
        .nav-item:hover { background-color: #1a1a1a; color: #f3f4f6; }
        .nav-item.active { background-color: #222222; color: #f3f4f6; }
        .nav-item.active i { color: #a855f7; }
        .nav-shortcut { margin-left: auto; font-size: 11px; color: #4b5563; }

        /* Main content area */
        main { flex: 1; background-color: #181818; position: relative; border-top-left-radius: 24px; border-bottom-left-radius: 24px; margin: 8px 8px 8px 0; overflow: hidden; }

        /* Custom scrollbar for iframe */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside>
            <!-- Logo -->
            <div class="flex items-center gap-3 px-3 mb-10 cursor-pointer">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-[#a855f7] to-[#7e22ce] flex items-center justify-center shadow-[0_0_15px_rgba(168,85,247,0.4)]">
                    <i data-lucide="layers" class="w-4 h-4 text-white"></i>
                </div>
                <span class="text-lg font-bold text-white tracking-tight">StowMind.</span>
                <i data-lucide="chevrons-up-down" class="w-4 h-4 text-[#6b7280] ml-auto"></i>
            </div>

            <!-- Navigation Sections -->
            <div class="flex-1 overflow-y-auto">
                <div class="nav-section">
                    <div class="nav-title">Overview <i data-lucide="chevron-down" class="w-3 h-3"></i></div>
                    <a href="dashboard.html" target="content-frame" class="nav-item active" onclick="setActive(this)">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                    </a>
                    <a href="analyze.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="pie-chart" class="w-4 h-4"></i> Space Analyzer
                        <span class="nav-shortcut">⌘+A</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-title">Cleanup <i data-lucide="chevron-down" class="w-3 h-3"></i></div>
                    <a href="clean.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Deep Clean
                        <span class="nav-shortcut">⌘+C</span>
                    </a>
                    <a href="duplicates.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="copy" class="w-4 h-4"></i> Duplicates
                    </a>
                    <a href="apps.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="grid" class="w-4 h-4"></i> Uninstaller
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-title">Management <i data-lucide="chevron-down" class="w-3 h-3"></i></div>
                    <a href="organize.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="folder-tree" class="w-4 h-4"></i> Organizer
                    </a>
                    <a href="history.html" target="content-frame" class="nav-item" onclick="setActive(this)">
                        <i data-lucide="history" class="w-4 h-4"></i> History
                    </a>
                </div>
            </div>

            <!-- User Profile -->
            <div class="mt-auto pt-4 border-t border-borderLight flex items-center gap-3 px-2 cursor-pointer hover:bg-[#1a1a1a] p-2 rounded-xl transition-colors">
                <img src="https://i.pravatar.cc/100?img=33" alt="User" class="w-9 h-9 rounded-full border border-[#2e2e2e]">
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-white truncate">Jean Doe</p>
                    <p class="text-xs text-[#6b7280] truncate">Pro Plan Active</p>
                </div>
                <i data-lucide="chevron-down" class="w-4 h-4 text-[#6b7280]"></i>
            </div>
        </aside>

        <!-- Main Content -->
        <main>
            <iframe name="content-frame" src="dashboard.html" class="absolute inset-0 w-full h-full border-none"></iframe>
        </main>
    </div>

    <script>
        lucide.createIcons();

        function setActive(element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
