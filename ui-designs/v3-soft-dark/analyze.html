<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        mainBg: '#181818', cardBg: '#222222', cardHover: '#2a2a2a', borderLight: '#2e2e2e',
                        textMain: '#f3f4f6', textMuted: '#9ca3af',
                        accentYellow: '#f59e0b', accentOrange: '#f97316', accentBlue: '#3b82f6', accentGreen: '#10b981', accentRed: '#ef4444', accentPurple: '#a855f7'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: transparent; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        .soft-card { background-color: #222222; border-radius: 16px; border: 1px solid transparent; transition: all 0.2s ease; }
        .soft-card:hover { background-color: #2a2a2a; border-color: #3f3f46; }
        .icon-box { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="p-8 h-full overflow-y-auto">

    <div class="flex justify-between items-start mb-8">
        <div>
            <h1 class="text-3xl font-semibold text-white mb-2">Space Analyzer</h1>
            <p class="text-[#9ca3af] text-sm">Visual map of your disk usage</p>
        </div>
        <div class="flex items-center gap-3">
            <button class="px-4 py-2 bg-[#2a2a2a] hover:bg-[#3f3f46] rounded-xl text-sm font-medium text-white transition-colors flex items-center gap-2">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> Rescan
            </button>
        </div>
    </div>

    <div class="grid grid-cols-12 gap-6">
        <!-- Left: Folder Tree/List -->
        <div class="col-span-7 soft-card p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-base font-medium text-white">Macintosh HD</h3>
                <span class="text-sm text-[#9ca3af]">494.38 GB Total</span>
            </div>

            <div class="space-y-2">
                <!-- Item 1 -->
                <div class="flex items-center justify-between p-3 hover:bg-[#2a2a2a] rounded-xl cursor-pointer transition-colors group">
                    <div class="flex items-center gap-4">
                        <i data-lucide="chevron-right" class="w-4 h-4 text-[#6b7280]"></i>
                        <div class="icon-box bg-blue-600/20 text-blue-400">
                            <i data-lucide="folder" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-medium text-white">Users</h4>
                            <p class="text-xs text-[#6b7280]">12 items</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-24 h-1.5 bg-[#181818] rounded-full overflow-hidden">
                            <div class="h-full bg-blue-500 rounded-full" style="width: 60%"></div>
                        </div>
                        <span class="text-sm text-[#9ca3af] w-16 text-right">120.5 GB</span>
                    </div>
                </div>

                <!-- Item 2 -->
                <div class="flex items-center justify-between p-3 hover:bg-[#2a2a2a] rounded-xl cursor-pointer transition-colors group">
                    <div class="flex items-center gap-4">
                        <i data-lucide="chevron-right" class="w-4 h-4 text-[#6b7280]"></i>
                        <div class="icon-box bg-purple-600/20 text-purple-400">
                            <i data-lucide="folder" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-medium text-white">Applications</h4>
                            <p class="text-xs text-[#6b7280]">142 items</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-24 h-1.5 bg-[#181818] rounded-full overflow-hidden">
                            <div class="h-full bg-purple-500 rounded-full" style="width: 25%"></div>
                        </div>
                        <span class="text-sm text-[#9ca3af] w-16 text-right">45.2 GB</span>
                    </div>
                </div>

                <!-- Item 3 -->
                <div class="flex items-center justify-between p-3 hover:bg-[#2a2a2a] rounded-xl cursor-pointer transition-colors group">
                    <div class="flex items-center gap-4">
                        <i data-lucide="chevron-right" class="w-4 h-4 text-[#6b7280]"></i>
                        <div class="icon-box bg-orange-600/20 text-orange-400">
                            <i data-lucide="folder" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-medium text-white">System</h4>
                            <p class="text-xs text-[#6b7280]">System files</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-24 h-1.5 bg-[#181818] rounded-full overflow-hidden">
                            <div class="h-full bg-orange-500 rounded-full" style="width: 15%"></div>
                        </div>
                        <span class="text-sm text-[#9ca3af] w-16 text-right">22.5 GB</span>
                    </div>
                </div>

                <!-- Item 4 -->
                <div class="flex items-center justify-between p-3 hover:bg-[#2a2a2a] rounded-xl cursor-pointer transition-colors group">
                    <div class="flex items-center gap-4">
                        <div class="w-4 h-4"></div> <!-- Spacer -->
                        <div class="icon-box bg-[#181818] text-[#9ca3af]">
                            <i data-lucide="file" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-medium text-white">swapfile</h4>
                            <p class="text-xs text-[#6b7280]">System</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-24 h-1.5 bg-[#181818] rounded-full overflow-hidden">
                            <div class="h-full bg-[#6b7280] rounded-full" style="width: 5%"></div>
                        </div>
                        <span class="text-sm text-[#9ca3af] w-16 text-right">4.0 GB</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Visual Chart -->
        <div class="col-span-5 soft-card p-6 flex flex-col items-center justify-center relative">
            <h3 class="text-base font-medium text-white absolute top-6 left-6">Distribution</h3>

            <div class="relative w-64 h-64 mt-8">
                <svg viewBox="0 0 100 100" class="w-full h-full transform -rotate-90">
                    <!-- Background circle -->
                    <circle cx="50" cy="50" r="40" fill="none" stroke="#181818" stroke-width="16" />
                    <!-- Segments -->
                    <circle cx="50" cy="50" r="40" fill="none" stroke="#3b82f6" stroke-width="16" stroke-dasharray="150 251.2" stroke-dashoffset="0" />
                    <circle cx="50" cy="50" r="40" fill="none" stroke="#a855f7" stroke-width="16" stroke-dasharray="60 251.2" stroke-dashoffset="-150" />
                    <circle cx="50" cy="50" r="40" fill="none" stroke="#f97316" stroke-width="16" stroke-dasharray="30 251.2" stroke-dashoffset="-210" />
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="text-3xl font-bold text-white">188<span class="text-lg text-[#9ca3af]">GB</span></span>
                    <span class="text-xs text-[#6b7280] mt-1">Used Space</span>
                </div>
            </div>

            <div class="w-full mt-8 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-blue-500"></div><span class="text-[#9ca3af]">Users</span></div>
                    <span class="text-white font-medium">63%</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-purple-500"></div><span class="text-[#9ca3af]">Applications</span></div>
                    <span class="text-white font-medium">24%</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-orange-500"></div><span class="text-[#9ca3af]">System</span></div>
                    <span class="text-white font-medium">13%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
