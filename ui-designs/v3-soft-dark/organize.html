<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        mainBg: '#181818', cardBg: '#222222', cardHover: '#2a2a2a', borderLight: '#2e2e2e',
                        textMain: '#f3f4f6', textMuted: '#9ca3af',
                        accentPurple: '#a855f7'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: transparent; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        .soft-card { background-color: #222222; border-radius: 16px; border: 1px solid transparent; transition: all 0.2s ease; }
        .soft-card:hover { background-color: #2a2a2a; border-color: #3f3f46; }

        /* Toggle Switch */
        .toggle-switch {
            width: 36px; height: 20px; background-color: #181818; border: 1px solid #3f3f46; border-radius: 100px;
            position: relative; cursor: pointer; transition: all 0.2s;
        }
        .toggle-switch.active { background-color: #a855f7; border-color: #a855f7; }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
            background-color: #9ca3af; border-radius: 50%; transition: all 0.2s;
        }
        .toggle-switch.active::after { transform: translateX(16px); background-color: #ffffff; }
    </style>
</head>
<body class="p-8 h-full overflow-y-auto">

    <div class="flex justify-between items-start mb-8">
        <div>
            <h1 class="text-3xl font-semibold text-white mb-2">File Organizer</h1>
            <p class="text-[#9ca3af] text-sm">Automate your file management</p>
        </div>
        <button class="px-4 py-2 bg-[#a855f7] hover:bg-[#9333ea] text-white rounded-xl text-sm font-medium transition-colors flex items-center gap-2 shadow-[0_4px_14px_rgba(168,85,247,0.3)]">
            <i data-lucide="plus" class="w-4 h-4"></i> Create Rule
        </button>
    </div>

    <div class="grid grid-cols-2 gap-6">
        <!-- Rule Card 1 -->
        <div class="soft-card p-6 border border-[#2e2e2e]">
            <div class="flex justify-between items-start mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-blue-500/20 text-blue-400 flex items-center justify-center">
                        <i data-lucide="image" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-medium text-white">Sort Images</h3>
                        <p class="text-xs text-[#6b7280]">Last run: 2 hours ago</p>
                    </div>
                </div>
                <div class="toggle-switch active" onclick="this.classList.toggle('active')"></div>
            </div>

            <div class="bg-[#181818] rounded-xl p-4 space-y-3">
                <div class="flex items-center gap-3 text-sm">
                    <span class="text-[#6b7280] w-12">IF</span>
                    <span class="text-white bg-[#2a2a2a] px-2 py-1 rounded-md">File type is Image</span>
                </div>
                <div class="flex items-center gap-3 text-sm">
                    <span class="text-[#6b7280] w-12">AND</span>
                    <span class="text-white bg-[#2a2a2a] px-2 py-1 rounded-md">In ~/Downloads</span>
                </div>
                <div class="flex items-center gap-3 text-sm">
                    <span class="text-[#a855f7] font-medium w-12">THEN</span>
                    <span class="text-white bg-[#2a2a2a] px-2 py-1 rounded-md border border-[#a855f7]/30">Move to ~/Pictures</span>
                </div>
            </div>

            <div class="mt-4 flex justify-end gap-2">
                <button class="p-2 text-[#9ca3af] hover:text-white hover:bg-[#2a2a2a] rounded-lg transition-colors"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                <button class="p-2 text-[#9ca3af] hover:text-red-400 hover:bg-red-400/10 rounded-lg transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
        </div>

        <!-- Rule Card 2 -->
        <div class="soft-card p-6 border border-[#2e2e2e]">
            <div class="flex justify-between items-start mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center">
                        <i data-lucide="archive" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-medium text-white">Archive Old Projects</h3>
                        <p class="text-xs text-[#6b7280]">Last run: Yesterday</p>
                    </div>
                </div>
                <div class="toggle-switch" onclick="this.classList.toggle('active')"></div>
            </div>

            <div class="bg-[#181818] rounded-xl p-4 space-y-3 opacity-60">
                <div class="flex items-center gap-3 text-sm">
                    <span class="text-[#6b7280] w-12">IF</span>
                    <span class="text-white bg-[#2a2a2a] px-2 py-1 rounded-md">Older than 30 days</span>
                </div>
                <div class="flex items-center gap-3 text-sm">
                    <span class="text-[#6b7280] w-12">AND</span>
                    <span class="text-white bg-[#2a2a2a] px-2 py-1 rounded-md">In ~/Projects</span>
                </div>
                <div class="flex items-center gap-3 text-sm">
                    <span class="text-[#a855f7] font-medium w-12">THEN</span>
                    <span class="text-white bg-[#2a2a2a] px-2 py-1 rounded-md border border-[#a855f7]/30">Compress to .zip</span>
                </div>
            </div>

            <div class="mt-4 flex justify-end gap-2">
                <button class="p-2 text-[#9ca3af] hover:text-white hover:bg-[#2a2a2a] rounded-lg transition-colors"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                <button class="p-2 text-[#9ca3af] hover:text-red-400 hover:bg-red-400/10 rounded-lg transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
