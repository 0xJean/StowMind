name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 Git 标签（如 v1.0.0），将检出该标签并发布"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  publish-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 须与 pnpm-lock.yaml（lockfileVersion 6.x = pnpm 8）一致；latest 常为 pnpm 9/10 会报 LOCKFILE_BREAKING_CHANGE
          version: 8.15.5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: require macOS release credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_TEAM_ID
            APPLE_API_KEY
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required macOS release secrets: ${missing[*]}"
            exit 1
          fi

          d="APPLE_EOF_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_$(openssl rand -hex 8)"
          {
            echo "APPLE_CERTIFICATE<<${d}"
            printf '%s\n' "${APPLE_CERTIFICATE}"
            echo "${d}"
            echo "APPLE_CERTIFICATE_PASSWORD<<${d}_P12"
            printf '%s\n' "${APPLE_CERTIFICATE_PASSWORD}"
            echo "${d}_P12"
            echo "APPLE_SIGNING_IDENTITY<<${d}_ID"
            printf '%s\n' "${APPLE_SIGNING_IDENTITY}"
            echo "${d}_ID"
            echo "APPLE_TEAM_ID<<${d}_TID"
            printf '%s\n' "${APPLE_TEAM_ID}"
            echo "${d}_TID"
          } >> "${GITHUB_ENV}"

      - name: build universal macOS app
        run: pnpm tauri build --target universal-apple-darwin

      - name: verify Developer ID signature
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/StowMind.app"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          signature="$(codesign -dvvv "${app_path}" 2>&1)"
          printf '%s\n' "${signature}"
          grep -F "Authority=Developer ID Application:" <<< "${signature}"
          grep -F "TeamIdentifier=${EXPECTED_TEAM_ID}" <<< "${signature}"
          if grep -Fq "Signature=adhoc" <<< "${signature}"; then
            echo "::error::Refusing to publish an ad-hoc signed application."
            exit 1
          fi

      - name: notarize and staple macOS disk image
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "${APPLE_API_KEY}" > "${key_path}"
          chmod 600 "${key_path}"

          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name 'StowMind_*.dmg' -print -quit)"
          if [ -z "${dmg_path}" ]; then
            echo "::error::No StowMind DMG was produced."
            exit 1
          fi

          xcrun notarytool submit "${dmg_path}" \
            --key "${key_path}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait \
            --timeout 30m
          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"
          spctl -a -t open --context context:primary-signature -v "${dmg_path}"

      - name: collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name 'StowMind_*.dmg' -exec cp {} release-assets/ \;
          find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -exec cp {} release-assets/ \;
          shasum -a 256 release-assets/* | tee release-assets/SHA256SUMS.txt

      - name: publish GitHub release
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const tagName = process.env.TAG_NAME
            const owner = context.repo.owner
            const repo = context.repo.repo
            const defaultBody = 'Developer ID signed and notarized universal macOS build.'
            const notesPath = path.join('.github', 'release-notes', `${tagName}.md`)
            const releaseBody = fs.existsSync(notesPath)
              ? fs.readFileSync(notesPath, 'utf8')
              : defaultBody

            let release = null
            for await (const response of github.paginate.iterator(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            )) {
              release = response.data.find((item) => item.tag_name === tagName)
              if (release) break
            }

            if (!release) {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tagName,
                name: `StowMind ${tagName}`,
                body: releaseBody,
                draft: true,
                prerelease: false,
              })
              release = created.data
            }

            for (const asset of release.assets) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              })
            }

            const assetDir = 'release-assets'
            for (const fileName of fs.readdirSync(assetDir)) {
              const filePath = path.join(assetDir, fileName)
              const data = fs.readFileSync(filePath)
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: fileName,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
                data,
              })
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: `StowMind ${tagName}`,
              body: releaseBody,
              draft: false,
              prerelease: false,
            })
