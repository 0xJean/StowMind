name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 Git 标签（如 v1.0.0），将检出该标签并发布"
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-macos:
    environment: production-release
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # 须与 pnpm-lock.yaml（lockfileVersion 6.x = pnpm 8）一致；latest 常为 pnpm 9/10 会报 LOCKFILE_BREAKING_CHANGE
          version: 8.15.5

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: verify release tag and version manifests
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/check-release-manifest.mjs

      - name: require macOS release credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_TEAM_ID
            APPLE_API_KEY
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required macOS release secrets: ${missing[*]}"
            exit 1
          fi

      - name: preflight Apple notarization access
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/notarize-macos.mjs preflight

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: build universal macOS app
        env:
          IOS_HELPER_ARCHS: universal
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          keychain_path="${RUNNER_TEMP}/stowmind-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="${RUNNER_TEMP}/stowmind-release-ci.p12"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          existing_keychains="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "${keychain_path}" ${existing_keychains}
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"
          pnpm build:ios-helper
          pnpm tauri build --target universal-apple-darwin --config src-tauri/tauri.ios.conf.json

      - name: verify Developer ID signature
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/StowMind.app"
          helper_path="${app_path}/Contents/Resources/binaries/stowmind-ios-helper"
          test -x "${helper_path}"
          codesign --verify --strict --verbose=2 "${helper_path}"
          helper_signature="$(codesign -dvvv "${helper_path}" 2>&1)"
          printf '%s\n' "${helper_signature}"
          grep -F "Authority=Developer ID Application:" <<< "${helper_signature}"
          grep -F "TeamIdentifier=${EXPECTED_TEAM_ID}" <<< "${helper_signature}"
          if grep -Fq "Signature=adhoc" <<< "${helper_signature}"; then
            echo "::error::Refusing to publish an ad-hoc signed iOS mirror helper."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          signature="$(codesign -dvvv "${app_path}" 2>&1)"
          printf '%s\n' "${signature}"
          grep -F "Authority=Developer ID Application:" <<< "${signature}"
          grep -F "TeamIdentifier=${EXPECTED_TEAM_ID}" <<< "${signature}"
          if grep -Fq "Signature=adhoc" <<< "${signature}"; then
            echo "::error::Refusing to publish an ad-hoc signed application."
            exit 1
          fi

      - name: notarize and staple macOS disk image
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dmg_path="src-tauri/target/universal-apple-darwin/release/bundle/dmg/StowMind_${version}_universal.dmg"
          if [ ! -f "${dmg_path}" ]; then
            echo "::error::No StowMind DMG was produced."
            exit 1
          fi

          node scripts/notarize-macos.mjs notarize "${dmg_path}"

      - name: clean temporary release credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cleanup_failed=0
          keychain_path="${RUNNER_TEMP}/stowmind-signing.keychain-db"
          if [ -f "${keychain_path}" ]; then
            if ! security delete-keychain "${keychain_path}"; then
              echo "::error::Could not delete the temporary signing keychain."
              cleanup_failed=1
            fi
          fi
          if ! rm -f "${RUNNER_TEMP}/stowmind-release-ci.p12"; then
            echo "::error::Could not delete the temporary signing certificate."
            cleanup_failed=1
          fi
          for key_directory in "${RUNNER_TEMP}"/stowmind-notary-*; do
            [ -d "${key_directory}" ] || continue
            if [ -L "${key_directory}" ]; then
              echo "::error::Unexpected symbolic link in temporary notarization credentials."
              cleanup_failed=1
              continue
            fi
            if ! rm -f "${key_directory}/AuthKey.p8"; then
              cleanup_failed=1
            fi
            if ! rmdir "${key_directory}"; then
              cleanup_failed=1
            fi
          done
          exit "${cleanup_failed}"

      - name: collect release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dmg_name="StowMind_${version}_universal.dmg"
          mkdir -p release-assets
          cp "src-tauri/target/universal-apple-darwin/release/bundle/dmg/${dmg_name}" "release-assets/${dmg_name}"
          (
            cd release-assets
            shasum -a 256 -- "${dmg_name}" | tee SHA256SUMS.txt
          )

      - name: publish GitHub release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        with:
          script: |
            const { publishRelease } = require('./scripts/lib/publish-release.cjs')
            await publishRelease({ github, context, core, tagName: process.env.TAG_NAME })
