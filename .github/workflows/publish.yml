name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 Git 标签（如 v1.0.0），将检出该标签并发布"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  publish-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 须与 pnpm-lock.yaml（lockfileVersion 6.x = pnpm 8）一致；latest 常为 pnpm 9/10 会报 LOCKFILE_BREAKING_CHANGE
          version: 8.15.5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: macOS signing env from secrets (optional)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            echo "APPLE_CERTIFICATE not set; building ad-hoc macOS artifacts."
            exit 0
          fi

          d="APPLE_EOF_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_$(openssl rand -hex 8)"
          {
            echo "APPLE_CERTIFICATE<<${d}"
            printf '%s\n' "${APPLE_CERTIFICATE}"
            echo "${d}"
            echo "APPLE_CERTIFICATE_PASSWORD<<${d}_P12"
            printf '%s\n' "${APPLE_CERTIFICATE_PASSWORD}"
            echo "${d}_P12"
            echo "APPLE_SIGNING_IDENTITY<<${d}_ID"
            printf '%s\n' "${APPLE_SIGNING_IDENTITY}"
            echo "${d}_ID"
            if [ -n "${APPLE_ID}" ] && [ -n "${APPLE_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
              echo "APPLE_ID<<${d}_AID"
              printf '%s\n' "${APPLE_ID}"
              echo "${d}_AID"
              echo "APPLE_PASSWORD<<${d}_APW"
              printf '%s\n' "${APPLE_PASSWORD}"
              echo "${d}_APW"
              echo "APPLE_TEAM_ID<<${d}_TID"
              printf '%s\n' "${APPLE_TEAM_ID}"
              echo "${d}_TID"
            fi
            if [ -n "${APPLE_PROVIDER_SHORT_NAME}" ]; then
              echo "APPLE_PROVIDER_SHORT_NAME<<${d}_PROVIDER"
              printf '%s\n' "${APPLE_PROVIDER_SHORT_NAME}"
              echo "${d}_PROVIDER"
            fi
          } >> "${GITHUB_ENV}"

      - name: build universal macOS app
        run: pnpm tauri build --target universal-apple-darwin

      - name: collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name 'StowMind_*.dmg' -exec cp {} release-assets/ \;
          find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -exec cp {} release-assets/ \;
          shasum -a 256 release-assets/* | tee release-assets/SHA256SUMS.txt

      - name: publish GitHub release
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const tagName = process.env.TAG_NAME
            const owner = context.repo.owner
            const repo = context.repo.repo

            let release = null
            for await (const response of github.paginate.iterator(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            )) {
              release = response.data.find((item) => item.tag_name === tagName)
              if (release) break
            }

            if (!release) {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tagName,
                name: `StowMind ${tagName}`,
                body: 'Universal macOS build. Assets may be ad-hoc signed unless Apple signing secrets are configured.',
                draft: true,
                prerelease: false,
              })
              release = created.data
            }

            for (const asset of release.assets) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              })
            }

            const assetDir = 'release-assets'
            for (const fileName of fs.readdirSync(assetDir)) {
              const filePath = path.join(assetDir, fileName)
              const data = fs.readFileSync(filePath)
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: fileName,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
                data,
              })
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: `StowMind ${tagName}`,
              body: 'Universal macOS build. Assets may be ad-hoc signed unless Apple signing secrets are configured.',
              draft: false,
              prerelease: false,
            })
