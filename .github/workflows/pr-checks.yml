name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Keep these names stable: main requires both check contexts.
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.15.5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend behavior
        run: node --test scripts/*.test.mjs

      - name: Build frontend
        run: pnpm build

  macos:
    name: macos
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.15.5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name == 'push' }}

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      # Tauri's custom-protocol build reads dist from this job's checkout.
      - name: Build frontend assets for Tauri
        run: pnpm build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check --locked

      - name: Test Rust behavior
        working-directory: src-tauri
        run: cargo test --locked

      - name: Test Swift safety evidence
        run: bash scripts/test-ios-helper-evidence.sh

      # This builds only a local debug .app and verifies its signatures.
      # Hosted runners use the documented ad-hoc debug fallback, with no secrets.
      - name: Build and verify debug App resources
        env:
          IOS_HELPER_ARCHS: universal
        run: pnpm tauri:build:ios-debug

      - name: Verify bundled universal helper
        run: |
          helper_path='src-tauri/target/debug/bundle/macos/StowMind Dev.app/Contents/Resources/binaries/stowmind-ios-helper'
          test -x "$helper_path"
          lipo "$helper_path" -verify_arch arm64 x86_64
